name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # 日本語でレビューさせる。プロジェクト規約は CLAUDE.md に従う
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストを日本語でレビューしてください。以下の観点で確認します:
            - コードの品質とベストプラクティス
            - 潜在的なバグやエッジケースの考慮漏れ
            - パフォーマンス上の懸念（N+1 クエリなど）
            - セキュリティ上の懸念
            - テストのカバレッジ（PHPUnit）

            リポジトリの規約は CLAUDE.md に従うこと（PSR-12 準拠、コメントは「なぜ」を日本語で）。
            具体的な指摘は inline comment で、全体的な所感は top-level comment で伝えてください。

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
