name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude が PR の CI 結果を読むために必要
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # プロジェクト規約（コミットメッセージ・コメントは日本語、PSR-12 準拠、
          # テストは PHPUnit、Sail 経由でコマンド実行）は CLAUDE.md を参照させる
          # claude_args: |
          #   --system-prompt "CLAUDE.md のプロジェクト規約に従うこと"

          # 任意: トリガーフレーズの変更（デフォルト: @claude）
          # trigger_phrase: "/claude"

          # 任意: issue の担当者アサインでトリガー
          # assignee_trigger: "claude-bot"
