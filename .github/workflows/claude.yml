name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Claude が PR の CI 結果を読むために必要
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # @claude メンション時は日本語でレビューさせる。
          # トリガーになった issue / PR / コメントの内容は Claude に渡される
          prompt: |
            REPO: ${{ github.repository }}
            NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            この issue / PR を日本語でレビューしてください。以下の観点で確認します:
            - コードの品質とベストプラクティス
            - 潜在的なバグやエッジケースの考慮漏れ
            - パフォーマンス上の懸念（N+1 クエリなど）
            - セキュリティ上の懸念
            - テストのカバレッジ（PHPUnit）

            リポジトリの規約は CLAUDE.md に従うこと（PSR-12 準拠、コメントは「なぜ」を日本語で）。
            具体的な指摘は inline comment で、全体的な所感は top-level comment で伝えてください。

          # モデルと最大ターン数を指定（deprecated な model / max_turns 入力ではなく claude_args で渡す）
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 5

          # 任意: トリガーフレーズの変更（デフォルト: @claude）
          # trigger_phrase: "/claude"

          # 任意: issue の担当者アサインでトリガー
          # assignee_trigger: "claude-bot"
